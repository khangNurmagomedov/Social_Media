<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends - Chia sẻ khoảnh khắc</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fw: {
              primary: '#0D9488',
              light: '#2DD4BF',
              accent: '#5EEAD4',
              warm: '#14B8A6',
              dark: '#0A0F0F',
              card: '#111B1B',
              subtle: '#1A2B2B'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'locket': '2.5rem',
            'squircle': '2rem'
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col justify-between items-center bg-fw-dark text-gray-100 overflow-x-hidden">

  <!-- Navigation Header -->
  {% include 'includes/header.html' %}

  <!-- Main Content Container -->
  <main class="w-full max-w-md pt-24 pb-28 px-4 flex-1 flex flex-col items-center">

    <!-- View Tabs -->
    {% include 'includes/tabs.html' %}

    <!-- View 1: Upload & Camera Section -->
    {% include 'includes/camera_view.html' %}

    <!-- View 2: Feed Section -->
    {% include 'includes/feed_view.html' %}

    <!-- View 3: Profile Section -->
    {% include 'includes/profile_view.html' %}

  </main>

  <!-- Modals & Toast -->
  {% include 'includes/modals.html' %}

  <!-- Main Application Logic Script -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
