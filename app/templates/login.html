<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Friends Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { locket: { yellow: '#FFB800', orange: '#FF7A00', dark: '#0D0D0E', card: '#1A1A1E' } } } }
    }
  </script>
</head>
<body class="min-h-screen bg-locket-dark text-white flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-locket-card border border-white/10 rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-locket-orange to-locket-yellow mx-auto flex items-center justify-center text-black text-2xl font-black mb-3 shadow-lg">
        <i class="fa-solid fa-camera"></i>
      </div>
      <h2 id="formTitle" class="text-xl font-extrabold">Đăng nhập Friends Web</h2>
      <p class="text-xs text-gray-400 mt-1">Kết nối và chia sẻ khoảnh khắc</p>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Tài khoản</label>
        <input type="text" id="username" required placeholder="Nhập tên đăng nhập" class="w-full px-4 py-2.5 bg-locket-dark border border-white/10 rounded-xl text-sm focus:outline-none focus:border-locket-yellow">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Mật khẩu</label>
        <input type="password" id="password" required placeholder="Nhập mật khẩu" class="w-full px-4 py-2.5 bg-locket-dark border border-white/10 rounded-xl text-sm focus:outline-none focus:border-locket-yellow">
      </div>

      <!-- Các trường mở rộng cho Đăng ký -->
      <div id="registerFields" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Tên hiển thị thật của bạn</label>
          <input type="text" id="fullName" placeholder="VD: Nguyễn Văn A" class="w-full px-4 py-2.5 bg-locket-dark border border-white/10 rounded-xl text-sm focus:outline-none focus:border-locket-yellow">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Chọn Avatar</label>
          <div class="grid grid-cols-5 gap-2" id="avatarList"></div>
        </div>
      </div>

      <p id="errorMsg" class="text-xs text-red-400 text-center hidden"></p>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-locket-yellow text-black font-bold text-sm rounded-xl shadow-lg hover:bg-yellow-400 transition-all mt-2">
        Đăng nhập
      </button>
    </form>

    <div class="text-center mt-4">
      <button onclick="toggleMode()" id="toggleBtn" class="text-xs text-locket-yellow hover:underline">
        Chưa có tài khoản? Đăng ký ngay
      </button>
    </div>
  </div>

  <script>
    let isRegister = false;
    let selectedAvatar = '🦊';
    const avatars = ['🦊', '🐱', '🐶', '🐼', '🐯', '🐻', '🐰', '🦁', '🐸', '🤖'];

    window.onload = () => {
      document.getElementById('avatarList').innerHTML = avatars.map(a => 
        `<button type="button" onclick="selectedAvatar='${a}'; renderAvatars()" class="avatar-btn text-xl p-1.5 rounded-lg border border-white/10 ${selectedAvatar === a ? 'bg-white/20 border-locket-yellow' : ''}">${a}</button>`
      ).join('');
    };

    function renderAvatars() {
      document.querySelectorAll('.avatar-btn').forEach((btn, idx) => {
        if (avatars[idx] === selectedAvatar) btn.className = "avatar-btn text-xl p-1.5 rounded-lg border border-locket-yellow bg-white/20";
        else btn.className = "avatar-btn text-xl p-1.5 rounded-lg border border-white/10";
      });
    }

    function toggleMode() {
      isRegister = !isRegister;
      document.getElementById('formTitle').innerText = isRegister ? 'Đăng ký tài khoản' : 'Đăng nhập Friends Web';
      document.getElementById('submitBtn').innerText = isRegister ? 'Tạo tài khoản' : 'Đăng nhập';
      document.getElementById('toggleBtn').innerText = isRegister ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký ngay';
      document.getElementById('registerFields').classList.toggle('hidden', !isRegister);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';

      const payload = { username, password };
      if (isRegister) {
        payload.name = document.getElementById('fullName').value;
        payload.avatar = selectedAvatar;
      }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '/'; // Chuyển hướng về trang chủ
        } else {
          errorMsg.innerText = data.message;
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.innerText = "Lỗi kết nối máy chủ";
        errorMsg.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
