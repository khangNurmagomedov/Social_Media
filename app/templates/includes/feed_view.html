<section id="feedView" class="w-full flex flex-col items-center space-y-6 hidden">
  
  <!-- Filter option -->
  <div class="w-full flex justify-between items-center px-1">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Khoảnh khắc mới nhất</p>
    <button onclick="loadFeed()" class="text-xs text-fw-accent hover:underline flex items-center gap-1">
      <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
      <span>Làm mới</span>
    </button>
  </div>

  <!-- Feed Container -->
  <div id="feedList" class="w-full space-y-6 flex flex-col items-center">
    <!-- Feed cards injected dynamically -->
    <div class="flex flex-col items-center justify-center py-12 text-gray-500 space-y-3">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl text-fw-light"></i>
      <p class="text-xs">Đang tải bảng tin Locket...</p>
    </div>
  </div>
</section>
