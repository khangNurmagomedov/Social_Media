<section id="cameraView" class="w-full flex flex-col items-center space-y-5">
  
  <!-- Locket Photo Frame Container -->
  <div class="relative w-full aspect-square max-w-[340px] bg-fw-card squircle-frame border-2 border-teal-500/15 shadow-2xl flex flex-col items-center justify-center overflow-hidden locket-glow group">
    
    <!-- Live WebCam Video View -->
    <video id="webcamVideo" autoplay playsinline class="hidden absolute inset-0 w-full h-full object-cover"></video>

    <!-- Image Preview Screen -->
    <img id="imagePreview" src="" alt="Locket Preview" class="hidden absolute inset-0 w-full h-full object-cover">

    <!-- Default Placeholder UI -->
    <div id="uploadPlaceholder" class="flex flex-col items-center text-center p-6 space-y-4">
      <div class="w-16 h-16 rounded-full bg-fw-subtle flex items-center justify-center text-fw-accent text-2xl border border-teal-500/15 shadow-inner animate-bounce">
        <i class="fa-solid fa-cloud-arrow-up"></i>
      </div>
      <div>
        <p class="font-bold text-gray-200 text-sm">Chọn hình ảnh cá nhân</p>
        <p class="text-xs text-gray-400 mt-1">Hoặc sử dụng Camera để chụp trực tiếp</p>
      </div>
      <div class="flex flex-col w-full gap-2 pt-2">
        <label class="cursor-pointer px-4 py-2.5 bg-fw-subtle hover:bg-teal-500/10 rounded-2xl border border-teal-500/10 text-xs font-semibold text-gray-200 flex items-center justify-center gap-2 transition-all">
          <i class="fa-regular fa-image text-fw-accent"></i>
          <span>Tải ảnh từ máy</span>
          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        </label>
        <button onclick="startCamera()" class="px-4 py-2.5 bg-fw-subtle hover:bg-teal-500/10 rounded-2xl border border-teal-500/10 text-xs font-semibold text-gray-200 flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-camera text-fw-accent"></i>
          <span>Bật Camera</span>
        </button>
      </div>
    </div>

    <!-- Camera Controls Overlay (When camera active) -->
    <div id="cameraControls" class="hidden absolute bottom-4 left-0 right-0 flex justify-center items-center gap-6 z-10 px-4">
      <button onclick="stopCamera()" class="w-10 h-10 rounded-full glass-pill flex items-center justify-center text-white text-sm hover:bg-red-500/80 transition-all">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button onclick="takeSnap()" class="w-16 h-16 rounded-full bg-white border-4 border-fw-primary shadow-lg shadow-teal-500/30 flex items-center justify-center text-black active:scale-95 transition-all">
        <div class="w-12 h-12 rounded-full border-2 border-black/20"></div>
      </button>
      <div class="w-10 h-10"></div> <!-- Spacer -->
    </div>

    <!-- Re-select or Reset Image Button (When image preview ready) -->
    <button id="resetImgBtn" onclick="resetImageSelection()" class="hidden absolute top-3 right-3 glass-pill px-3 py-1.5 rounded-full text-xs font-semibold text-white flex items-center gap-1.5 hover:bg-black/80 transition-all z-20">
      <i class="fa-solid fa-rotate-left"></i>
      <span>Chọn lại</span>
    </button>
  </div>

  <!-- Caption & Posting Options -->
  <div id="postForm" class="w-full max-w-[340px] space-y-3">
    <!-- Caption Input -->
    <div class="relative">
      <input type="text" id="captionInput" placeholder="Viết dòng trạng thái" 
        maxlength="60"
        class="w-full px-4 py-3 bg-fw-card border border-teal-500/10 rounded-2xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-fw-primary focus:ring-1 focus:ring-fw-primary/30 transition-all pr-12">
      <span id="charCounter" class="absolute right-3 top-3.5 text-[10px] text-gray-500 font-mono">0/60</span>
    </div>

    <!-- Quick Caption Chips -->
    <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
      <button onclick="setQuickCaption('☕ Cà phê cùng bạn')" class="px-3 py-1 bg-fw-subtle hover:bg-teal-500/10 border border-teal-500/10 rounded-full whitespace-nowrap text-gray-300">☕ Cà phê</button>
      <button onclick="setQuickCaption('🌅 Hoàng hôn chill')" class="px-3 py-1 bg-fw-subtle hover:bg-teal-500/10 border border-teal-500/10 rounded-full whitespace-nowrap text-gray-300">🌅 Hoàng hôn</button>
      <button onclick="setQuickCaption('🍕 Lên đồ đi ăn')" class="px-3 py-1 bg-fw-subtle hover:bg-teal-500/10 border border-teal-500/10 rounded-full whitespace-nowrap text-gray-300">🍕 Đi ăn</button>
      <button onclick="setQuickCaption('💻 Working late')" class="px-3 py-1 bg-fw-subtle hover:bg-teal-500/10 border border-teal-500/10 rounded-full whitespace-nowrap text-gray-300">💻 Học tập</button>
    </div>

    <!-- Submit Button -->
    <button id="submitLocketBtn" onclick="uploadLocket()" disabled class="w-full py-3.5 bg-gradient-to-r from-fw-primary to-fw-light text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-teal-500/25 opacity-50 cursor-not-allowed hover:opacity-100 transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-paper-plane"></i>
      <span>Gửi ngay</span>
    </button>
  </div>

</section>
